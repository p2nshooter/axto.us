name: Deploy to Cloudflare

# axto.us is a static site: the engine in sites/_engine turns the Markdown in
# sites/axto.us into plain HTML, the quality gate checks it, and Wrangler
# uploads the result as Workers Static Assets to the existing "axto-us" Worker
# (which keeps the axto.us custom domain). No database, no secrets in the site.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and check the site (AdSense readiness gate)
        run: node sites/_engine/check.mjs axto.us

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Best effort: (re)attaches axto.us and www.axto.us to this Worker when
      # CLOUDFLARE_ZONE_ID is set. Normally a no-op because the domains are
      # already attached; it matters when the site moves to another account.
      - name: Attach axto.us custom domain (best effort)
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "CLOUDFLARE_ZONE_ID not set, skipping."
            exit 0
          fi
          for host in axto.us www.axto.us; do
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"hostname\":\"$host\",\"zone_id\":\"$CLOUDFLARE_ZONE_ID\",\"service\":\"axto-us\",\"environment\":\"production\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
            echo
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Smoke test the live site
        run: |
          sleep 20
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' https://axto.us/)
          echo "axto.us -> HTTP $code"
          # 24 Nov 2026 (pemilik): 5 akun AdSense — loader akun utama, 5 tag meta, 5 baris ads.txt, tanpa akun lama
          grep -q 'adsbygoogle.js?client=ca-pub-6560360898389273' /tmp/home.html && echo "AdSense loader present" || echo "::warning::AdSense loader not seen on the live home page yet (cache?)"
          for p in 6560360898389273 4906992051458194 5928074389292014 6701063918838796 5092800160376210; do grep -q "content=\"ca-pub-$p\"" /tmp/home.html || echo "::warning::meta ca-pub-$p not seen yet"; done
          old=$(grep -oE 'ca-pub-[0-9]{16}' /tmp/home.html | sort -u | grep -vE '6560360898389273|4906992051458194|5928074389292014|6701063918838796|5092800160376210' || true)
          [ -z "$old" ] || echo "::error::old AdSense account(s) still on the page: $old"
          curl -s https://axto.us/ads.txt
